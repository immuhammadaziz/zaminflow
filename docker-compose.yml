services:
  postgres:
    image: zaminflow-postgres:16
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/Postgres.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zaminflow}
      POSTGRES_USER: ${POSTGRES_USER:-zaminflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/migrate"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-zaminflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zaminflow}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-ZaminFlow <noreply@zaminflow.uz>}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zaminflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zaminflow}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-ZaminFlow <noreply@zaminflow.uz>}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/admin", "create"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-zaminflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zaminflow}?sslmode=disable
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["admin-tools"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.18.2
    environment:
      SWAGGER_JSON_URL: /docs/openapi.yaml
    volumes:
      - ./docs:/usr/share/nginx/html/docs:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    profiles: ["dev-tools"]

volumes:
  postgres_data:
