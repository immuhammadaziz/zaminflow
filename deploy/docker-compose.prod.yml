name: zaminflow

services:
  postgres:
    image: zaminflow-postgres:16
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/Postgres.Dockerfile
    env_file:
      - ../.env.production
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.production}
      POSTGRES_USER_FILE: /run/secrets/zaminflow_db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/zaminflow_db_password
    secrets:
      - zaminflow_db_user
      - zaminflow_db_password
    tmpfs:
      - /run/postgres-secrets:rw,noexec,nosuid,size=1m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/migrate"]
    env_file:
      - ../.env.production
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER_FILE: /run/secrets/zaminflow_db_user
      DB_PASSWORD_FILE: /run/secrets/zaminflow_db_password
      APP_SECRET_FILE: /run/secrets/zaminflow_app_secret
      METRICS_TOKEN_FILE: /run/secrets/zaminflow_metrics_token
      MIGRATIONS_DIR: /app/migrations
      SMTP_REQUIRE_TLS: "true"
    secrets:
      - zaminflow_app_secret
      - zaminflow_db_user
      - zaminflow_db_password
      - zaminflow_metrics_token
    tmpfs:
      - /run/app-secrets:rw,noexec,nosuid,size=1m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env.production
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER_FILE: /run/secrets/zaminflow_db_user
      DB_PASSWORD_FILE: /run/secrets/zaminflow_db_password
      APP_SECRET_FILE: /run/secrets/zaminflow_app_secret
      METRICS_TOKEN_FILE: /run/secrets/zaminflow_metrics_token
      MIGRATIONS_DIR: /app/migrations
      SMTP_REQUIRE_TLS: "true"
    secrets:
      - zaminflow_app_secret
      - zaminflow_db_user
      - zaminflow_db_password
      - zaminflow_metrics_token
    tmpfs:
      - /run/app-secrets:rw,noexec,nosuid,size=1m
    expose: ["8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge, database]
    restart: unless-stopped

  caddy:
    image: zaminflow-caddy:2
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

networks:
  edge:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  zaminflow_app_secret:
    file: ${SECRETS_DIR:-/opt/zaminflow/secrets}/zaminflow_app_secret
  zaminflow_db_user:
    file: ${SECRETS_DIR:-/opt/zaminflow/secrets}/zaminflow_db_user
  zaminflow_db_password:
    file: ${SECRETS_DIR:-/opt/zaminflow/secrets}/zaminflow_db_password
  zaminflow_metrics_token:
    file: ${SECRETS_DIR:-/opt/zaminflow/secrets}/zaminflow_metrics_token
