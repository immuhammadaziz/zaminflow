openapi: 3.0.3
info:
  title: ZaminFlow API
  version: 1.0.0
  description: Implemented Go/PostgreSQL API. See docs/API_CONTRACT.md and docs/FRONTEND_INTEGRATION.md for workflow and client guidance.
servers:
  - url: https://api.zaminflow.uz/api/v1
    description: Production API base path
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Meta
  - name: Auth
  - name: Profile
  - name: Admin
  - name: Listings
  - name: Orders
  - name: Dashboards
  - name: Health
paths:
  /meta/roles:
    get:
      tags: [Meta]
      operationId: listSignupRoles
      summary: List roles selectable at sign-up
      responses:
        '200':
          description: Farmer and processor roles only
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleOption'
        '429':
          $ref: '#/components/responses/RateLimited'
  /meta/regions:
    get:
      tags: [Meta]
      operationId: listRegions
      summary: List Uzbekistan regions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Region references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRegions'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Register a pending farmer or processor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Pending account created
          content:
            application/json:
              schema:
                type: object
                required: [user, message]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in; admin users must provide TOTP or a recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Access token and user; refresh and signed CSRF cookies are set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets zf_refresh (HttpOnly, Secure in production, SameSite=Lax, scoped to auth path) and zf_csrf (signed double-submit token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/email-verification/request:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      summary: Request an enumeration-safe verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted whether or not the account exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/email-verification/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmailVerification
      summary: Verify email with a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request password reset without disclosing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Consume password reset token and revoke existing sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue an access token
      description: Browser requests must include an allowlisted Origin and matching zf_csrf cookie and X-CSRF-Token header.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Refreshed session; refresh and signed CSRF cookies are set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets zf_refresh and zf_csrf cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: List the current user's sessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated sessions owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke one session owned by the caller
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change password and revoke other sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/totp/setup:
    post:
      tags: [Auth]
      operationId: setupAdminTotp
      summary: Begin mandatory admin TOTP enrollment
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      description: May be called by an enrollment-only session created after the first CLI-provisioned admin sign-in.
      responses:
        '200':
          description: Secret shown once for authenticator enrollment
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri]
                properties:
                  secret:
                    type: string
                  otpauthUri:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: confirmAdminTotp
      summary: Confirm admin TOTP and issue recovery codes
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: Recovery codes shown once
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/totp/recovery-codes/rotate:
    post:
      tags: [Auth]
      operationId: rotateAdminRecoveryCodes
      summary: Rotate one-time admin recovery codes
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: New recovery codes shown once
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Revoke current refresh-token family
      description: Requires an allowlisted Origin and matching zf_csrf cookie and X-CSRF-Token header.
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/resubmit:
    post:
      tags: [Profile]
      operationId: resubmitAccount
      summary: Resubmit corrected rejected account for review
      security:
        - bearerAuth: []
      x-allowed-roles: [farmer, processor]
      x-required-account-status: rejected
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: Account returned to pending and review attempt recorded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get the current user and live account status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update allowed fields on the current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Profile]
      operationId: requestAccountDeletion
      summary: Submit an account deletion request for administrator review
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Request recorded for administrator review; no account data is erased by this endpoint
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [requested]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/deletion-request:
    get:
      tags: [Profile]
      operationId: getOwnAccountDeletionRequest
      summary: Get the current user's latest account deletion request and review status
      security:
        - bearerAuth: []
      x-allowed-roles: [farmer, processor]
      responses:
        '200':
          description: The latest request and its review status
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/OwnDeletionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/deletion-requests:
    get:
      tags: [Admin]
      operationId: listAccountDeletionRequests
      summary: List account deletion requests for administrator review
      description: Defaults to pending requests. Approval records a decision for a separate, manually governed retention process; it never erases account data or restricts marketplace activity. Recheck open transactions and applicable legal obligations before any separate manual retention action.
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Defaults to requested; use all to include every status.
          schema:
            type: string
            enum: [requested, approved, completed, rejected, all]
            default: requested
      responses:
        '200':
          description: Paginated deletion requests and associated account profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeletionRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/deletion-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/DeletionRequestId'
    post:
      tags: [Admin]
      operationId: approveAccountDeletionRequest
      summary: Approve a deletion request for separate manual retention review
      description: Does not erase or change account data/status or restrict marketplace activity. Requests with active orders cannot be approved at review time; recheck open transactions and applicable legal obligations before any separate manual retention action.
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Request decision recorded and audited; account data remains unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/deletion-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/DeletionRequestId'
    post:
      tags: [Admin]
      operationId: rejectAccountDeletionRequest
      summary: Reject an account deletion request with a reason
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Request decision recorded and audited; account data remains unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/applications:
    get:
      tags: [Admin]
      operationId: listApplications
      summary: List verified applicants awaiting review
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema:
            type: string
            enum: [farmer, processor]
        - name: regionCode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Review queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/applications/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      operationId: getApplication
      summary: Get applicant profile and review history
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      responses:
        '200':
          description: Applicant and review attempts
          content:
            application/json:
              schema:
                type: object
                required: [user, reviews]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/applications/{userId}/approve:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      operationId: approveApplication
      summary: Approve an eligible applicant
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Account approved and decision audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/applications/{userId}/reject:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      operationId: rejectApplication
      summary: Reject an applicant with a reason
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Account rejected and decision audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}/suspend:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      operationId: suspendUser
      summary: Suspend user, revoke sessions, and audit the decision
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Account suspended and sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/{userId}/reinstate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      operationId: reinstateUser
      summary: Reinstate a suspended user
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Account reinstated and decision audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/audit-events:
    get:
      tags: [Admin]
      operationId: listAuditEvents
      summary: Query redacted administrative and security audit events
      security:
        - bearerAuth: []
      x-allowed-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
            format: uuid
        - name: targetType
          in: query
          schema:
            type: string
            maxLength: 40
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEvents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /listings:
    get:
      tags: [Listings]
      operationId: listListings
      summary: Search listings as an approved processor, or view own listings as a farmer
      security:
        - bearerAuth: []
      x-allowed-roles: [farmer, processor]
      x-required-account-status: approved
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: regionCode
          in: query
          schema:
            type: string
        - name: minLiters
          in: query
          schema:
            type: integer
            minimum: 1
        - name: sort
          in: query
