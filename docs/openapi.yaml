components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: zf_refresh
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeletionRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    DashboardPeriod:
      name: period
      in: query
      description: Defaults to 30d; ignored when both from and to are supplied.
      schema:
        type: string
        enum: [7d, 30d, 90d, 12m]
        default: 30d
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Wrong role, unapproved account, or missing MFA
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or inaccessible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Field validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RoleOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
          enum: [farmer, processor]
        label:
          type: string
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, password, role, phone, organizationName, regionCode, stir]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        role:
          type: string
          enum: [farmer, processor]
        phone:
          type: string
          pattern: '^\+998[0-9]{9}$'
        organizationName:
          type: string
          minLength: 2
          maxLength: 200
        regionCode:
          type: string
          maxLength: 32
        stir:
          type: string
          maxLength: 32
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        totpCode:
          type: string
        recoveryCode:
          type: string
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 160
        phone:
          type: string
          pattern: '^\+998[0-9]{9}$'
        organizationName:
          type: string
          minLength: 2
          maxLength: 200
        regionCode:
          type: string
          maxLength: 32
        stir:
          type: string
          maxLength: 32
    User:
      type: object
      required: [id, role, accountStatus, email, emailVerified, fullName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [farmer, processor, admin]
        accountStatus:
          type: string
          enum: [pending, approved, rejected, suspended]
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        fullName:
          type: string
        phone:
          type: string
        organizationName:
          type: string
        regionCode:
          type: string
        stir:
          type: string
        rejectionReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Region:
      type: object
      required: [code, nameUz, nameRu, nameEn]
      properties:
        code:
          type: string
        nameUz:
          type: string
        nameRu:
          type: string
        nameEn:
          type: string
    ListingInput:
      type: object
      additionalProperties: false
      required: [regionCode, availableLiters, fatPercent, pricePerLiterUzs, availableFrom, availableUntil]
      properties:
        regionCode:
          type: string
        availableLiters:
          type: integer
          minimum: 1
        fatPercent:
          type: number
          minimum: 0
          maximum: 100
        pricePerLiterUzs:
          type: integer
          minimum: 1
        availableFrom:
          type: string
          format: date-time
        availableUntil:
          type: string
          format: date-time
    Listing:
      allOf:
        - $ref: '#/components/schemas/ListingInput'
        - type: object
          required: [id, farmerId, status, createdAt]
          properties:
            id:
              type: string
              format: uuid
            farmerId:
              type: string
              format: uuid
            status:
              type: string
              enum: [draft, active, paused, sold_out, expired, archived]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    OrderInput:
      type: object
      additionalProperties: false
      required: [listingId, liters, expectedPickupAt]
      properties:
        listingId:
          type: string
          format: uuid
        liters:
          type: integer
          minimum: 1
        expectedPickupAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 2000
    OrderStatus:
      type: string
      enum: [placed, accepted, rejected, cancelled, ready_for_pickup, picked_up, delivered, completed, disputed]
    Order:
      type: object
      required: [id, listingId, farmerId, processorId, liters, pricePerLiterUzs, totalUzs, status, expectedPickupAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        farmerId:
          type: string
          format: uuid
        processorId:
          type: string
          format: uuid
        liters:
          type: integer
        pricePerLiterUzs:
          type: integer
        totalUzs:
          type: integer
        status:
          $ref: '#/components/schemas/OrderStatus'
        expectedPickupAt:
          type: string
          format: date-time
        note:
          type: string
        qualityOutcome:
          type: string
          enum: [accepted, rejected]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistoryItem'
    OrderHistoryItem:
      type: object
      required: [status, actorId, createdAt]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        actorId:
          type: string
          format: uuid
        note:
          type: string
        createdAt:
          type: string
          format: date-time
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PaginatedRegions:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Region'
    PaginatedUsers:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
    AccountDeletionRequest:
      type: object
      required: [id, user, status, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: [requested, approved, completed, rejected]
        requestedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
        reviewReason:
          type: string
    OwnDeletionRequest:
      type: object
      required: [id, status, requestedAt]
      properties:
        id:
