  <text x="710" y="260" fill="#2B211B" font-family="Arial,sans-serif" font-size="15" font-weight="700">A simple, shared workflow</text>
  <text x="710" y="281" fill="#5E6259" font-family="Arial,sans-serif" font-size="12">Designed around real marketplace steps</text>
  <circle cx="682" cy="350" r="18" fill="#E6EBE1"/><text x="677" y="355" fill="#2F5D46" font-family="Arial,sans-serif" font-size="13" font-weight="700">1</text>
  <text x="718" y="347" fill="#2B211B" font-family="Arial,sans-serif" font-size="15" font-weight="700">Farmers publish an offer</text>
  <text x="718" y="369" fill="#5E6259" font-family="Arial,sans-serif" font-size="13">Volume, quality, region and price</text>
  <path d="M682 373v22" stroke="#D9D5C9" stroke-width="2"/>
  <circle cx="682" cy="423" r="18" fill="#F4EBDD"/><text x="677" y="428" fill="#87520F" font-family="Arial,sans-serif" font-size="13" font-weight="700">2</text>
  <text x="718" y="420" fill="#2B211B" font-family="Arial,sans-serif" font-size="15" font-weight="700">Processors place an order</text>
  <text x="718" y="442" fill="#5E6259" font-family="Arial,sans-serif" font-size="13">Available stock is reserved atomically</text>
  <path d="M682 446v22" stroke="#D9D5C9" stroke-width="2"/>
  <circle cx="682" cy="496" r="18" fill="#E8EEF1"/><text x="677" y="501" fill="#315B76" font-family="Arial,sans-serif" font-size="13" font-weight="700">3</text>
  <text x="718" y="493" fill="#2B211B" font-family="Arial,sans-serif" font-size="15" font-weight="700">Both sides track milestones</text>
  <text x="718" y="515" fill="#5E6259" font-family="Arial,sans-serif" font-size="13">The parties coordinate fulfillment</text>
  <text x="650" y="558" fill="#5E6259" font-family="Arial,sans-serif" font-size="11">No payments or transport are arranged by the platform.</text>
  <text x="49" y="618" fill="#2B211B" font-family="Georgia,serif" font-size="25" font-weight="700">Built for two sides of the dairy market</text>
  <rect x="48" y="641" width="495" height="116" rx="16" fill="#FFFFFF" stroke="#E3DED2"/>
  <text x="72" y="677" fill="#2F5D46" font-family="Arial,sans-serif" font-size="13" font-weight="700">FOR FARMERS</text>
  <text x="72" y="708" fill="#2B211B" font-family="Arial,sans-serif" font-size="17" font-weight="700">Make available supply easier to compare.</text>
  <text x="72" y="733" fill="#5E6259" font-family="Arial,sans-serif" font-size="13">Manage offers and respond to processor orders.</text>
  <rect x="560" y="641" width="488" height="116" rx="16" fill="#FFFFFF" stroke="#E3DED2"/>
  <text x="584" y="677" fill="#2F5D46" font-family="Arial,sans-serif" font-size="13" font-weight="700">FOR PROCESSORS</text>
  <text x="584" y="708" fill="#2B211B" font-family="Arial,sans-serif" font-size="17" font-weight="700">Find offers with the details that matter.</text>
  <text x="584" y="733" fill="#5E6259" font-family="Arial,sans-serif" font-size="13">Reserve volume and track order status together.</text>
  <rect x="1130" y="52" width="388" height="770" rx="24" fill="#F7F5EF" stroke="#D9D5C9"/>
  <rect x="1130" y="52" width="388" height="36" rx="20" fill="#E9E6DC"/>
