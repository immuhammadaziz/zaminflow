  <text x="263" y="503" fill="#2B211B" font-family="Arial,sans-serif" font-size="14" font-weight="700">How it works</text>
  <rect x="630" y="210" width="418" height="370" rx="24" fill="#FFFFFF" stroke="#E3DED2"/>
  <rect x="650" y="230" width="378" height="70" rx="15" fill="#F4F2EC"/>
