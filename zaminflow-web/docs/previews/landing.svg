  <text x="1150" y="274" fill="#2B211B" font-family="Georgia,serif" font-size="37" font-weight="700">From farm</text>
  <text x="1150" y="316" fill="#2F5D46" font-family="Georgia,serif" font-size="37" font-weight="700">supply to</text>
  <text x="1150" y="358" fill="#2F5D46" font-family="Georgia,serif" font-size="37" font-weight="700">trusted trade.</text>
