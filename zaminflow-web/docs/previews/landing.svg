  <rect x="48" y="214" width="185" height="32" rx="16" fill="#E6EBE1"/>
  <circle cx="66" cy="230" r="5" fill="#2F5D46"/>
  <text x="80" y="235" fill="#2F5D46" font-family="Arial,sans-serif" font-size="13" font-weight="700">A clearer dairy marketplace</text>
  <text x="48" y="309" fill="#2B211B" font-family="Georgia,serif" font-size="49" font-weight="700">From farm supply</text>
  <text x="48" y="367" fill="#2F5D46" font-family="Georgia,serif" font-size="49" font-weight="700">to trusted trade.</text>
  <text x="50" y="412" fill="#5E6259" font-family="Arial,sans-serif" font-size="17">A shared workspace for Uzbekistan's farmers and dairy processors.</text>
  <text x="50" y="438" fill="#5E6259" font-family="Arial,sans-serif" font-size="17">Verified accounts, clear offers and order milestones in one place.</text>
  <rect x="48" y="473" width="174" height="48" rx="24" fill="#2F5D46"/>
  <text x="70" y="503" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="14" font-weight="700">Create an account  →</text>
