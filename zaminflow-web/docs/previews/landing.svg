  <text x="1172" y="611" fill="#2B211B" font-family="Arial,sans-serif" font-size="15" font-weight="700">The marketplace, step by step</text>
  <text x="1172" y="650" fill="#2F5D46" font-family="Arial,sans-serif" font-size="13" font-weight="700">01</text>
  <text x="1210" y="650" fill="#2B211B" font-family="Arial,sans-serif" font-size="13">Publish an offer</text>
  <text x="1172" y="690" fill="#87520F" font-family="Arial,sans-serif" font-size="13" font-weight="700">02</text>
  <text x="1210" y="690" fill="#2B211B" font-family="Arial,sans-serif" font-size="13">Place an order</text>
  <text x="1172" y="730" fill="#315B76" font-family="Arial,sans-serif" font-size="13" font-weight="700">03</text>
  <text x="1210" y="730" fill="#2B211B" font-family="Arial,sans-serif" font-size="13">Track milestones</text>
  <text x="1172" y="761" fill="#5E6259" font-family="Arial,sans-serif" font-size="10">No payment or transport service is implied.</text>
