<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="850" viewBox="0 0 1540 850" role="img" aria-labelledby="title desc">
  <title id="title">ZaminFlow landing page desktop and mobile design preview</title>
  <desc id="desc">Static design mockup using ivory, espresso and sage brand cues. No live or invented marketplace data is shown.</desc>
  <rect width="1540" height="850" fill="#EEECE5"/>
  <text x="24" y="34" fill="#5E6259" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">01 / PUBLIC LANDING — DESKTOP 1080 × MOBILE 388</text>
