name: zaminflow-web

include:
  - path: ../docker-compose.yml

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api/v1}
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api/v1}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/uz"]
      interval: 10s
      timeout: 3s
      retries: 5
